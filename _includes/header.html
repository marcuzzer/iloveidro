<header class="site-header">
  <h3 class="site-title">
    <a href="/">{{ site.title }}</a>
  </h3>
 <nav class="menu-list">
<!--  <a href="{{ site.baseurl }}/en/" class="language-link">EN</a>
  <a href="{{ site.baseurl }}/it/" class="language-link">IT</a>
  <a href="{{ site.baseurl }}/de/" class="language-link">DE</a>
  <a href="{{ site.baseurl }}/nl/" class="language-link">NL</a>
-->

    {% for item in site.data.settings.menu %}
      <a href="/{{ item.url }}" class="menu-link">{{ item.name }}</a>
    {% endfor %}
    {% for item in site.data.settings.social %}
      <a href="{{ item.link }}" class="menu-link" target="_blank"><i class="fa fa-{{ item.icon }}" aria-hidden="true"></i></a>
    {% endfor %}

  
  </nav>
  <div class="dropdown">
    <button class="dropbtn"><i class="fa fa-bars" aria-hidden="true"></i></button>
    <div class="dropdown-content">
      {% for item in site.data.settings.menu %}
        <a href="/{{ item.url }}" class="menu-link">{{ item.name }}</a>
      {% endfor %}
      {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" class="menu-link" target="_blank"><i class="fa fa-{{ item.icon }}" aria-hidden="true"></i></a>
      {% endfor %}
    </div>
  </div>
</header>
