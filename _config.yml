# Site Build Settings
include:
  - '_posts/*/*'

# jekyll-paginate configuration
paginate:            5

# Build settings
markdown:            kramdown
highlighter:         rouge
permalink:           /:title
plugins:             [jekyll-paginate, jekyll-sitemap, jekyll-feed, jekyll-seo-tag]

baseurl: ""
url: "https://www.iloveidro.com"

# Site metadata
title:               "I Love Idro"
description:         "Esperienze autentiche al Lago d'Idro: kayak, trekking, MTB, windsurf, borghi e gastronomia. Guide in italiano, inglese, tedesco e olandese."
author:              "Marco"
lang:                "it"

# Default frontmatter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "Marco"

# RSS 2.0 can be used instead of Atom by uncommenting following two lines
#feed:
#  path: rss-feed.xml
